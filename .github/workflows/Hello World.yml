name: Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Checkout the repository
        #uses: actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Say hello
        run: echo "Hello, World from GitHub Actions!"

      - name: Say pwd
        run: pwd
      - name: List files
        run: ls -la
      
      - name: Show environment variables
        run: printenv 
      - name: Show GitHub context
        run: echo "${{ toJson(github) }}"
      - name: Show runner context
        run: echo "${{ toJson(runner) }}"
      - name: Show job context
        run: echo "${{ toJson(job) }}"
      - name: Show steps context
        run: echo "${{ toJson(steps) }}"  
      - name: Show matrix context
        run: echo "${{ toJson(matrix) }}"
      
      - name: Show workflow context
        run: echo "${{ toJson(workflow) }}"
      
      - name: Show repository context
        run: echo "${{ toJson(repository) }}"
      
      - name: Show secrets context
        run: echo "${{ toJson(secrets) }}"
      
      - name: Show inputs context
        run: echo "${{ toJson(inputs) }}"
      
      - name: Show event context
        run: echo "${{ toJson(event) }}"        
      - name: Show runner environment
        run: echo "${{ toJson(env) }}"      
      - name: Show runner OS
        run: uname -a
      - name: Show runner architecture
        run: uname -m
      - name: Show runner CPU info
        run: lscpu
      - name: Show runner memory info
        run: free -h
      - name: Show runner disk info
        run: df -h
      - name: Show runner network info
        run: ifconfig || ip addr
      - name: Show runner uptime
        run: uptime
      - name: Show runner processes
        run: ps aux
      - name: Show runner open files
        run: lsof
      - name: Show runner logged in users
        run: who
      - name: Show runner last logins
        run: last -a        
      - name: Show runner last reboot
        run: who -b
      - name: Show runner last shutdown
        run: last -x | grep shutdown
      - name: Show runner last crash
        run: last -x | grep crash
      - name: Show runner last kernel panic
        run: last -x | grep panic
      - name: Show runner last OOM
        run: last -x | grep oom
      - name: Show runner last hardware errors
        run: last -x | grep error
      - name: Show runner last filesystem errors
        run: last -x | grep filesystem
      - name: Show runner last security events
        run: last -x | grep security      
      - name: Show runner last authentication failures
        run: last -x | grep "authentication failure"
      - name: Show runner last sudo attempts
        run: last -x | grep sudo
     
      