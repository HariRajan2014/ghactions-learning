name: Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Say hello
        run: echo "Hello, World from GitHub Actions!"

      - name: Say pwd
        run: pwd

      - name: List files
        run: ls -la

      - name: Show environment variables
        run: printenv

      - name: Show contexts
        env:
          GITHUB_CTX: ${{ toJson(github) }}
          RUNNER_CTX: ${{ toJson(runner) }}
          JOB_CTX: ${{ toJson(job) }}
          STEPS_CTX: ${{ toJson(steps) }}
          INPUTS_CTX: ${{ toJson(inputs) }}
          ENV_CTX: ${{ toJson(env) }}
        run: |
          echo "$GITHUB_CTX"
          echo "$RUNNER_CTX"
          echo "$JOB_CTX"
          echo "$STEPS_CTX"
          echo "$INPUTS_CTX"
          echo "$ENV_CTX"

      - name: Show repository and workflow
        run: |
          echo "repository: ${{ github.repository }}"
          echo "workflow: ${{ github.workflow }}"
          echo "event: ${{ github.event_name }}"

      - name: Show system info
        run: |
          uname -a
          uname -m
          lscpu
          free -h
          df -h
          ifconfig || ip addr
          uptime
          ps aux
          who
          who -b

      - name: Show login history (may be empty)
        run: |
          last -a || true
          last -x | grep -E "shutdown|crash|panic|oom|error|filesystem|security|authentication failure|sudo" || true
