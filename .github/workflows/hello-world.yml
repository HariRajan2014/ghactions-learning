name: Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Make flaky-job fail to demo failure() and always()'
        type: boolean
        default: false

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Say hello
        run: echo "Hello, World from GitHub Actions!"

      - name: Say pwd
        run: pwd

      - name: List files
        run: ls -la

      - name: Show environment variables
        run: printenv

      - name: Show contexts
        env:
          GITHUB_CTX: ${{ toJson(github) }}
          RUNNER_CTX: ${{ toJson(runner) }}
          JOB_CTX: ${{ toJson(job) }}
          STEPS_CTX: ${{ toJson(steps) }}
          INPUTS_CTX: ${{ toJson(inputs) }}
          ENV_CTX: ${{ toJson(env) }}
        run: |
          echo "$GITHUB_CTX"
          echo "$RUNNER_CTX"
          echo "$JOB_CTX"
          echo "$STEPS_CTX"
          echo "$INPUTS_CTX"
          echo "$ENV_CTX"

      - name: Show repository and workflow
        run: |
          echo "repository: ${{ github.repository }}"
          echo "workflow: ${{ github.workflow }}"
          echo "event: ${{ github.event_name }}"

      - name: Show system info
        run: |
          uname -a
          uname -m
          lscpu
          free -h
          df -h
          ifconfig || ip addr
          uptime
          ps aux
          who
          who -b

      - name: Show login history (may be empty)
        run: |
          last -a || true
          last -x | grep -E "shutdown|crash|panic|oom|error|filesystem|security|authentication failure|sudo" || true
      - name: steps with different shell 
        shell: bash
        run: |
          echo "This step uses bash shell"
      - name: steps with different shell (sh)
        shell: sh
        run: |
          echo "This step uses sh shell"
      - name: steps with different shell (pwsh)
        shell: pwsh
        run: |
          echo "This step uses pwsh shell"
      - name: steps with different shell (python)
        shell: python
        run: |
          print("This step uses python shell")
      - name: steps with different shell (ruby)
        shell: ruby {0}
        run: |
          puts "This step uses ruby shell"
      - name: steps with different shell (node)
        shell: node {0}
        run: |
          console.log("This step uses node shell")
      - name: Install zsh and ksh
        run: sudo apt-get update && sudo apt-get install -y zsh ksh
      - name: steps with different shell (zsh)
        shell: zsh {0}
        run: |
          echo "This step uses zsh shell"
      - name: steps with different shell (ksh)
        shell: ksh {0}
        run: |
          echo "This step uses ksh shell"

  hello-windows:
    runs-on: windows-latest
    steps:
      - name: steps with different shell (cmd)
        shell: cmd
        run: |
          echo This step uses cmd shell
      - name: steps with different shell (powershell)
        shell: powershell
        run: |
          Write-Output "This step uses powershell shell"
      - name: steps with different shell (pwsh)
        shell: pwsh
        run: |
          Write-Output "This step uses pwsh shell"
      - name: steps with different shell (bash)
        shell: bash
        run: |
          echo "This step uses bash shell (Git Bash)"
      - name: steps with different shell (python)
        shell: python
        run: |
          print("This step uses python shell")

  job-3:
    runs-on: ubuntu-latest
    needs: [hello, hello-windows]
    steps:
      - name: Run after dependencies
        run: echo "job-3 runs only if hello and hello-windows succeeded"

  # Demo: success(), failure() and always() conditions.
  # Run manually (Run workflow) and tick simulate_failure to see the failure path.
  flaky-job:
    runs-on: ubuntu-latest
    steps:
      - name: Do some work
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          echo "Doing work..."
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulated failure"
            exit 1
          fi

  # Default: runs only when flaky-job succeeds.
  deploy:
    runs-on: ubuntu-latest
    needs: flaky-job
    steps:
      - run: echo "flaky-job succeeded, safe to deploy"

  # Use case: alert only when something upstream failed.
  notify-failure:
    runs-on: ubuntu-latest
    needs: flaky-job
    if: ${{ failure() }}
    steps:
      - run: echo "flaky-job failed, sending alert (e.g. Slack or email)"

  # Use case: always report the outcome, pass or fail (also runs on cancel with always()).
  summary:
    runs-on: ubuntu-latest
    needs: [flaky-job, deploy, notify-failure]
    if: ${{ always() }}
    steps:
      - name: Print results
        env:
          FLAKY: ${{ needs.flaky-job.result }}
          DEPLOY: ${{ needs.deploy.result }}
          NOTIFY: ${{ needs.notify-failure.result }}
        run: |
          echo "flaky-job:      $FLAKY"
          echo "deploy:         $DEPLOY"
          echo "notify-failure: $NOTIFY"
