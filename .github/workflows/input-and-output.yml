name: Input and Output

# ---------------------------------------------------------------------------
# WHAT THIS WORKFLOW SHOWS
#
#   INPUT  = a value YOU give when you start the workflow.
#   OUTPUT = a value a step or job PRODUCES so later steps or jobs can use it.
#
# Three ways to pass a value forward (Parts 2, 3 and 4 below):
#
#   Part  Way            Write it                            Read it                          Reaches
#   ----  -------------  ----------------------------------  -------------------------------  -----------------
#   2     env variable   echo "NAME=x" >> "$GITHUB_ENV"      $NAME                            later steps, same job
#   3     step output    echo "name=x" >> "$GITHUB_OUTPUT"   steps.<id>.outputs.name          later steps, same job
#   4     job output     outputs: block on the job           needs.<job>.outputs.name         other jobs
#
# Easiest: env variable (Part 2). To reach ANOTHER job you must use a job output (Part 4).
#
# HOW TO RUN: Actions tab -> Input and Output -> Run workflow, then read each step's log.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Your name'
        type: string
        default: 'World'
      target_env:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
      shout:
        description: 'Upper-case the greeting'
        type: boolean
        default: false

jobs:
  # ===== JOB 1: uses the inputs and creates outputs =====
  job-1:
    runs-on: ubuntu-latest

    # PART 4 (setup): publish a step output as a JOB output so other jobs can read it.
    outputs:
      greeting: ${{ steps.make-greeting.outputs.greeting }}

    steps:
      # PART 1 - INPUTS
      # Read an input with ${{ inputs.<name> }}.
      # Tip: copy it into env: first, then use $VAR in the script (safer than pasting it into the script).
      - name: Part 1 - Show the inputs
        env:
          NAME: ${{ inputs.name }}
          TARGET_ENV: ${{ inputs.target_env }}
          SHOUT: ${{ inputs.shout }}
        run: |
          echo "name:       $NAME"
          echo "target_env: $TARGET_ENV"
          echo "shout:      $SHOUT"

      # PART 2 - OUTPUT VIA ENV VARIABLE ($GITHUB_ENV)
      # Write NAME=value to the file $GITHUB_ENV. It becomes a normal env variable.
      - name: Part 2a - Save a value as an env variable
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: echo "DEPLOY_TARGET=$TARGET_ENV-cluster" >> "$GITHUB_ENV"

      # It is available from the NEXT step on (not inside the step that wrote it).
      - name: Part 2b - Use the env variable in a later step
        run: echo "DEPLOY_TARGET is $DEPLOY_TARGET"

      # PART 3 - OUTPUT VIA STEP OUTPUT ($GITHUB_OUTPUT)
      # Write name=value to the file $GITHUB_OUTPUT. Give the step an id so you can find it later.
      - name: Part 3a - Save a value as a step output
        id: make-greeting
        env:
          NAME: ${{ inputs.name }}
          SHOUT: ${{ inputs.shout }}
        run: |
          greeting="Hello, $NAME"
          if [ "$SHOUT" = "true" ]; then greeting="${greeting^^}"; fi
          echo "greeting=$greeting" >> "$GITHUB_OUTPUT"

      # Read it with ${{ steps.<id>.outputs.<name> }}.
      - name: Part 3b - Use the step output in a later step
        env:
          GREETING: ${{ steps.make-greeting.outputs.greeting }}
        run: |
          echo "greeting is: $GREETING"

  # ===== JOB 2: a different job =====
  job-2:
    runs-on: ubuntu-latest
    needs: job-1   # required to read job-1's outputs, and makes job-2 wait for job-1
    steps:
      # PART 4 - OUTPUT VIA JOB OUTPUT
      # Read it with ${{ needs.<job>.outputs.<name> }}.
      - name: Part 4a - Read the job output from job-1
        env:
          GREETING: ${{ needs.job-1.outputs.greeting }}
        run: |
          echo "greeting from job-1: $GREETING"

      # Env variables do NOT cross jobs, so this prints <empty>. Use a job output instead.
      - name: Part 4b - Env variable from job-1 is not here
        run: echo "DEPLOY_TARGET here is ${DEPLOY_TARGET:-<empty>}"
