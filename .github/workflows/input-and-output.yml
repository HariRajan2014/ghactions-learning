name: Input and Output

# ---------------------------------------------------------------------------
# WHAT THIS WORKFLOW SHOWS
#
#   INPUT  = a value YOU give when you start the workflow (the "Run workflow" form).
#            Declared under on: workflow_dispatch: inputs:   Read with ${{ inputs.<name> }}
#            Steps can only READ it. It has the same value in every job.
#   OUTPUT = a value a step or job CREATES while running, so later steps or jobs can use it.
#
# NAMING (so the logs are easy to read)
#   inp_*  or INP_*   = the value came from an INPUT
#   out_*  or OUT_*   = the value is an OUTPUT
#                       OUT_ENV_*  env variable | out_greeting  step/job output (OUT_STEP_* / OUT_JOB_* in the shell)
#   Every echo line starts with [from INPUT] or [from OUTPUT ...] so you see where the value came from.
#
# Three ways to pass an OUTPUT forward (Parts 2, 3 and 4 below):
#
#   Part  Way            Write it                                  Read it                          Reaches
#   ----  -------------  ----------------------------------------  -------------------------------  -----------------
#   2     env variable   echo "OUT_ENV_X=x" >> "$GITHUB_ENV"        $OUT_ENV_X                       later steps, same job
#   3     step output    echo "out_x=x" >> "$GITHUB_OUTPUT"        steps.<id>.outputs.out_x         later steps, same job
#   4     job output     outputs: block on the job                 needs.<job>.outputs.out_x        other jobs
#
# Easiest: env variable (Part 2). To reach ANOTHER job you must use a job output (Part 4).
#
# HOW TO RUN: Actions tab -> Input and Output -> Run workflow, then read each step's log.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    # INPUTS: the values you fill in on the "Run workflow" form (inp_ = input)
    inputs:
      inp_name:
        description: 'Your name'
        type: string
        default: 'World'
      inp_target_env:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
      inp_shout:
        description: 'Upper-case the greeting'
        type: boolean
        default: false

jobs:
  # ===== JOB 1: uses the inputs and creates outputs =====
  job-1:
    runs-on: ubuntu-latest

    # PART 4 (job-1 side): this "outputs:" block is REQUIRED for step 4a in job-2.
    # job-2 cannot see job-1's steps, so job-1 must publish the value here as a JOB output.
    #   left  = job output name (out_greeting)
    #   right = step output to copy (step id make-greeting, output out_greeting)
    outputs:
      out_greeting: ${{ steps.make-greeting.outputs.out_greeting }}

    steps:
      # PART 1 - INPUTS
      # Read an input with ${{ inputs.<name> }}.
      # Tip: copy it into env: first, then use $VAR in the script (safer than pasting it into the script).
      - name: Part 1 - Show the inputs
        env:
          INP_NAME: ${{ inputs.inp_name }}
          INP_TARGET_ENV: ${{ inputs.inp_target_env }}
          INP_SHOUT: ${{ inputs.inp_shout }}
        run: |
          echo "[from INPUT] inp_name       = $INP_NAME"
          echo "[from INPUT] inp_target_env = $INP_TARGET_ENV"
          echo "[from INPUT] inp_shout      = $INP_SHOUT"

      # PART 2 - OUTPUT VIA ENV VARIABLE ($GITHUB_ENV)
      # Write NAME=value to the file $GITHUB_ENV. It becomes a normal env variable.
      - name: Part 2a - Save a value as an env variable
        env:
          INP_TARGET_ENV: ${{ inputs.inp_target_env }}
        run: |
          echo "[from INPUT] inp_target_env = $INP_TARGET_ENV"
          echo "OUT_ENV_DEPLOY_TARGET=$INP_TARGET_ENV-cluster" >> "$GITHUB_ENV"
          echo "[saved as OUTPUT env variable] OUT_ENV_DEPLOY_TARGET = $INP_TARGET_ENV-cluster"

      # It is available from the NEXT step on (not inside the step that wrote it).
      - name: Part 2b - Use the env variable in a later step
        run: |
          echo "[from OUTPUT env variable] OUT_ENV_DEPLOY_TARGET = $OUT_ENV_DEPLOY_TARGET"

      # PART 3 - OUTPUT VIA STEP OUTPUT ($GITHUB_OUTPUT)
      # WRITER (3a) needs only 2 things: an "id:" and a line  echo "name=value" >> "$GITHUB_OUTPUT"
      # 3a does NOT use ${{ steps.make-greeting.outputs.out_greeting }} - that value does not exist until 3a finishes.
      - name: Part 3a - Save a value as a step output
        id: make-greeting
        env:
          INP_NAME: ${{ inputs.inp_name }}
          INP_SHOUT: ${{ inputs.inp_shout }}
        run: |
          echo "[from INPUT] inp_name  = $INP_NAME"
          echo "[from INPUT] inp_shout = $INP_SHOUT"
          greeting="Hello, $INP_NAME"
          if [ "$INP_SHOUT" = "true" ]; then greeting="${greeting^^}"; fi
          echo "out_greeting=$greeting" >> "$GITHUB_OUTPUT"
          echo "[saved as OUTPUT step output] out_greeting = $greeting"

      # READER (3b) is where ${{ steps.<id>.outputs.<name> }} is needed: any step AFTER the writer
      # (and the job-1 "outputs:" block at the top, which copies it up for other jobs).
      - name: Part 3b - Use the step output in a later step
        env:
          OUT_STEP_GREETING: ${{ steps.make-greeting.outputs.out_greeting }}
        run: |
          echo "[from OUTPUT step output] out_greeting = $OUT_STEP_GREETING"

  # ===== JOB 2: a different job =====
  job-2:
    runs-on: ubuntu-latest
    needs: job-1   # required to read job-1's outputs, and makes job-2 wait for job-1
    steps:
      # PART 4 - OUTPUT VIA JOB OUTPUT (job-2 side)
      # 4a does NOT use steps.make-greeting... (that step belongs to job-1).
      # It reads needs.job-1.outputs.out_greeting, which exists only because job-1's "outputs:" block
      # (see the top of job-1) copied the value up. Without that block this value is empty.
      - name: Part 4a - Read the job output from job-1
        env:
          OUT_JOB_GREETING: ${{ needs.job-1.outputs.out_greeting }}
        run: |
          echo "[from OUTPUT job output] out_greeting = $OUT_JOB_GREETING"

      # Env variables do NOT cross jobs, so this prints <empty>. Use a job output instead.
      - name: Part 4b - Env variable from job-1 is not here
        run: |
          echo "[OUTPUT env variable from job-1] OUT_ENV_DEPLOY_TARGET = ${OUT_ENV_DEPLOY_TARGET:-<empty>}"
